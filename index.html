<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Box - O Portal de Mini-Jogos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .font-arcade { font-family: 'Press Start 2P', monospace; }
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between">
    <!-- Header -->
    <header class="w-full py-6 bg-slate-900 border-b border-slate-800 shadow-xl text-center">
        <h1 class="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 bg-clip-text text-transparent font-arcade">Arcade Box</h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-2">Sua plataforma completa de jogos clássicos em um só lugar!</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-6xl p-4 flex-1 flex flex-col items-center justify-center my-6">
        <!-- Menu Principal -->
        <div id="menu" class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5">
            <button onclick="switchGame('snake')" class="bg-gradient-to-br from-green-600 to-emerald-900 hover:from-green-500 hover:to-emerald-800 p-5 rounded-2xl shadow-xl flex flex-col items-center transition transform hover:-translate-y-1 hover:scale-105 border border-green-500/30">
                <span class="text-4xl mb-3">🐍</span>
                <h2 class="text-sm font-bold font-arcade text-center">Cobrinha</h2>
                <p class="text-xs text-green-200 mt-2 text-center">Coma maçãs e cresça sem bater!</p>
            </button>
            <button onclick="switchGame('pong')" class="bg-gradient-to-br from-cyan-600 to-blue-900 hover:from-cyan-500 hover:to-blue-800 p-5 rounded-2xl shadow-xl flex flex-col items-center transition transform hover:-translate-y-1 hover:scale-105 border border-cyan-500/30">
                <span class="text-4xl mb-3">🏓</span>
                <h2 class="text-sm font-bold font-arcade text-center">Pong</h2>
                <p class="text-xs text-cyan-200 mt-2 text-center">Rebata a bola e vença a CPU!</p>
            </button>
            <button onclick="switchGame('futebol')" class="bg-gradient-to-br from-red-600 to-rose-900 hover:from-red-500 hover:to-rose-800 p-5 rounded-2xl shadow-xl flex flex-col items-center transition transform hover:-translate-y-1 hover:scale-105 border border-red-500/30">
                <span class="text-4xl mb-3">⚽</span>
                <h2 class="text-sm font-bold font-arcade text-center">Futebol Botão</h2>
                <p class="text-xs text-red-200 mt-2 text-center">Empurre a bola e marque gols!</p>
            </button>
            <button onclick="switchGame('genius')" class="bg-gradient-to-br from-violet-600 to-purple-900 hover:from-violet-500 hover:to-purple-800 p-5 rounded-2xl shadow-xl flex flex-col items-center transition transform hover:-translate-y-1 hover:scale-105 border border-purple-500/30">
                <span class="text-4xl mb-3">🧠</span>
                <h2 class="text-sm font-bold font-arcade text-center">Genius</h2>
                <p class="text-xs text-purple-200 mt-2 text-center">Memorize a sequência de cores!</p>
            </button>
            <button onclick="switchGame('velha')" class="bg-gradient-to-br from-pink-600 to-rose-950 hover:from-pink-500 hover:to-rose-900 p-5 rounded-2xl shadow-xl flex flex-col items-center transition transform hover:-translate-y-1 hover:scale-105 border border-pink-500/30">
                <span class="text-4xl mb-3">❌⭕</span>
                <h2 class="text-sm font-bold font-arcade text-center">Jogo da Velha</h2>
                <p class="text-xs text-pink-200 mt-2 text-center">O clássico passatempo
